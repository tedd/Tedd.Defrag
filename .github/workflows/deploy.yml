name: Build releases and deploy Pages

on:
  push:
    branches: [deploy]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in manual build artifacts
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Packages ${{ matrix.runtime }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore workloads
        shell: pwsh
        run: dotnet workload restore Tedd.Defrag.slnx
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif ($env:MANUAL_VERSION) {
            $version = $env:MANUAL_VERSION
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Invalid semantic version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install wix --tool-path $toolDirectory --version 5.0.2
          $wix = Join-Path $toolDirectory 'wix.exe'
          & $wix extension add --global WixToolset.BootstrapperApplications.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX bootstrapper extension installation failed.' }
          "WIX=$wix" >> $env:GITHUB_ENV
      - name: Publish and package
        shell: pwsh
        run: ./scripts/Publish.ps1 -Runtime '${{ matrix.runtime }}' -Version '${{ steps.version.outputs.version }}' -SourceRevision $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: Tedd.Defrag-${{ matrix.runtime }}
          path: |
            artifacts/dist/Tedd.Defrag-${{ matrix.runtime }}.zip
            artifacts/dist/Tedd.Defrag-${{ matrix.runtime }}.zip.sha256
            artifacts/dist/Tedd.Defrag-${{ matrix.runtime }}.msi
            artifacts/dist/Tedd.Defrag-${{ matrix.runtime }}.msi.sha256
            artifacts/dist/Tedd.Defrag-Setup-${{ matrix.runtime }}.exe
            artifacts/dist/Tedd.Defrag-Setup-${{ matrix.runtime }}.exe.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: Tedd.Defrag-*
          path: release-assets
          merge-multiple: true
      - name: Create release and upload verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "Tedd.Defrag $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
